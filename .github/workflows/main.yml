name: A-Share 14:40 Tail Monitor

on:
  schedule:
    - cron: '25 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write # 允许程序把查到的股票结果直接写回仓库首页 README.md

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. 读取你的仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装股票数据包
        run: |
          pip install --upgrade pip
          pip install akshare pandas

      - name: 4. 查询实时股票并生成报告
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python tail_monitor.py

      - name: 5. 将最新查询结果更新到仓库首页
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update latest stock report"
          git push
